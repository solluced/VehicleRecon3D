[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehiclerecon"
version = "0.1.0"
description = "Declarative, reference-constrained automobile reconstruction"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "setuptools>=68", "wheel"]

[project.scripts]
vehicle-recon = "vehiclerecon.cli:main"

[tool.setuptools.packages.find]
include = ["vehiclerecon*"]

[tool.setuptools.package-data]
"vehiclerecon.viewer" = ["*.html", "*.mjs"]

[tool.setuptools.data-files]
"share/vehiclerecon/schemas" = ["schemas/*.schema.json"]
"share/vehiclerecon/profiles" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["blender: invokes the installed Blender runtime", "integration: full reconstruction/browser regression"]
