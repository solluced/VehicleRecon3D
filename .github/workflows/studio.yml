name: Core and Studio
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -m 'not blender and not integration' -q
      - run: python -c "import importlib.util; assert importlib.util.find_spec('fastapi') is None; assert importlib.util.find_spec('vehiclerecon_studio') is None"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' -e 'studio/backend[test]'
      - run: python -m pytest studio/backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: python -m pip install -e '.[test]' -e 'studio/backend[test]'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: studio/frontend
      - run: npm run e2e
        working-directory: studio/frontend
        env:
          VEHICLERECON_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: |
            build/studio-v01b-*.json
            build/studio-v01b-*.png
            studio/frontend/test-results/
